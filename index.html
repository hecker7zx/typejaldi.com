<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeJaldi - The Ultimate Sketch Typing Experience</title>
    
    <!-- SEO & Favicon -->
    <meta name="description" content="Master your typing speed with TypeJaldi's immersive sketch-themed test. Smooth animations, real-time stats, and premium design.">
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/fa6-solid:keyboard.svg?color=%23ff5d00">
    
    <!-- Typography & Icons -->
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff5d00',
                        ink: '#2c2416',
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div class="app-container">
        <!-- Floating Decorations -->
        <div class="floating-doodle" style="top: 10%; left: 5%; transform: rotate(-15deg);">
            <i data-lucide="pencil" class="w-12 h-12"></i>
        </div>
        <div class="floating-doodle" style="bottom: 10%; right: 5%; transform: rotate(10deg);">
            <i data-lucide="scroll" class="w-16 h-16"></i>
        </div>

        <!-- Main Notebook -->
        <main class="notebook" id="notebook">
            <!-- Navigation -->
            <nav class="nav-bar">
                <a href="/" class="logo">Type<span>Jaldi</span></a>
                
                <div class="auth-buttons" id="authSection">
                    <!-- Dynamic auth content -->
                    <a href="/login.html" class="btn btn-ghost" id="loginBtn">
                        <i data-lucide="log-in" class="w-4 h-4"></i> Login
                    </a>
                    <button class="btn btn-primary" onclick="openProfile()" id="profileBtn" style="display:none;">
                        <i data-lucide="user" class="w-4 h-4"></i> Profile
                    </button>
                </div>
            </nav>

            <!-- Typing Engine Section -->
            <div class="typing-wrapper">
                <!-- Stats Row -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Speed</div>
                        <div class="stat-value" id="wpmDisplay">0</div>
                        <div class="text-[10px] uppercase font-bold opacity-40">WPM</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Accuracy</div>
                        <div class="stat-value" id="accDisplay">100</div>
                        <div class="text-[10px] uppercase font-bold opacity-40">%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Timer</div>
                        <div class="stat-value" id="timerDisplay">30</div>
                        <div class="text-[10px] uppercase font-bold opacity-40">Sec</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Streak</div>
                        <div class="stat-value" id="streakDisplay">0</div>
                        <div class="text-[10px] uppercase font-bold opacity-40">Words</div>
                    </div>
                </div>

                <!-- Word Display Area -->
                <div class="word-display" id="wordDisplayWrapper">
                    <div class="word-display-inner" id="wordDisplayInner">
                        <!-- Words injected by app.js -->
                    </div>
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20 italic text-xl" id="clickPrompt">
                        Click here to start sketching...
                    </div>
                </div>

                <!-- Hidden Input -->
                <input type="text" id="hiddenInput" class="absolute opacity-0 pointer-events-none" autocomplete="off" spellcheck="false">
                
                <!-- XP & Leveling -->
                <div class="xp-container">
                    <div class="xp-header">
                        <span id="levelText">Level 1 - Doodle Beginner</span>
                        <span id="xpText" class="opacity-50">0 / 100 XP</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill" id="xpBarFill"></div>
                    </div>
                </div>
            </div>

            <!-- Footer / Controls -->
            <footer class="mt-8 flex justify-between items-center">
                <button class="btn btn-ghost" onclick="restartTest()">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Redraw (Tab)
                </button>
                <div class="text-xs font-bold opacity-30 uppercase tracking-widest">
                    Hand-drawn with passion by TypeJaldi
                </div>
            </footer>
        </main>
    </div>

    <!-- Modals (Results/Profile) - Hidden by default -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-md z-[100] hidden flex items-center justify-center opacity-0">
        <!-- Modals will be injected here -->
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
