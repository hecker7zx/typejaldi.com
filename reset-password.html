<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TypeJaldi</title>
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/fa6-solid:keyboard.svg?color=%23ff5d00">
    <link rel="stylesheet" href="auth.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" id="resetCard">
            <div class="text-center mb-8">
                <a href="/" class="logo block mb-2" style="transform: rotate(0deg); text-align: center;">Type<span>Jaldi</span></a>
                <h2 class="text-xl font-extrabold mt-4" id="resetTitle">Reset Your Password</h2>
                <p class="text-sm opacity-50 mt-2" id="resetSubtitle">Enter your email and we'll send you a recovery link.</p>
            </div>

            <div id="auth-message" class="text-center mb-4 text-sm font-bold min-h-[20px]"></div>

            <!-- Request Reset Form (Default) -->
            <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="forgot-email" class="form-input" placeholder="ninja@example.com" required>
                </div>
                <button type="submit" id="btn-forgot" class="auth-btn">
                    <i data-lucide="send" class="w-5 h-5"></i> Send Reset Link
                </button>
            </form>

            <!-- Actual Reset Form (Hidden by default, shown if token in URL) -->
            <form id="resetForm" class="auth-form hidden">
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" id="new-password" class="form-input" placeholder="••••••••" required minlength="8">
                </div>
                <button type="submit" id="btn-reset" class="auth-btn">
                    <i data-lucide="check" class="w-5 h-5"></i> Update Password
                </button>
            </form>

            <div class="auth-footer">
                Remembered it? <a href="/login.html">Login</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const authMessage = document.getElementById('auth-message');
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('reset_token');

        if (token) {
            document.getElementById('forgotForm').classList.add('hidden');
            document.getElementById('resetForm').classList.remove('hidden');
            document.getElementById('resetTitle').textContent = "Set New Password";
            document.getElementById('resetSubtitle').textContent = "Type your new sketchy secret key below.";
        }

        // Entrance Animation
        gsap.from('#resetCard', {
            scale: 0.9,
            opacity: 0,
            duration: 1,
            ease: 'back.out(1.7)'
        });

        // Forgot Password Request
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            authMessage.textContent = "";
            authMessage.className = "text-center mb-4 text-sm font-bold min-h-[20px]";

            const btn = document.getElementById('btn-forgot');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> Sending...';
            lucide.createIcons();

            const email = document.getElementById('forgot-email').value.trim();

            try {
                const res = await fetch("/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email }),
                });
                const data = await res.json();
                if (res.ok) {
                    authMessage.textContent = "✅ " + (data.message || "Reset link sent!");
                    authMessage.classList.add("text-green-600");
                    document.getElementById('forgotForm').reset();
                } else {
                    authMessage.textContent = data.detail || "Request failed";
                    authMessage.classList.add("text-red-500");
                }
            } catch {
                authMessage.textContent = "Network error. Is the server running?";
                authMessage.classList.add("text-red-500");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
                lucide.createIcons();
            }
        });

        // Actual Password Reset
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            authMessage.textContent = "";
            authMessage.className = "text-center mb-4 text-sm font-bold min-h-[20px]";

            const btn = document.getElementById('btn-reset');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> Updating...';
            lucide.createIcons();

            const new_password = document.getElementById('new-password').value;

            try {
                const res = await fetch("/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, new_password }),
                });
                const data = await res.json();
                if (res.ok) {
                    authMessage.textContent = "✅ Password updated! Redirecting to login...";
                    authMessage.classList.add("text-green-600");
                    setTimeout(() => window.location.href = "/login.html", 2000);
                } else {
                    authMessage.textContent = data.detail || "Update failed";
                    authMessage.classList.add("text-red-500");
                }
            } catch {
                authMessage.textContent = "Network error. Is the server running?";
                authMessage.classList.add("text-red-500");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
