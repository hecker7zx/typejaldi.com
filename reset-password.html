<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeJaldi - Reset Secret Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Permanent+Marker&family=Rock+Salt&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sketch: {
                            orange: '#e8874b',
                            purple: '#7b5ea7',
                            teal: '#4a9c8c',
                            ink: '#2c2416',
                            paper: '#fdfaf3',
                        }
                    },
                    fontFamily: {
                        sketch: ['Caveat', 'cursive'],
                        marker: ['"Permanent Marker"', 'cursive'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --paper: #fdfaf3;
            --ink: #2c2416;
            --ink-light: #5c4f3a;
            --sketch-orange: #e8874b;
            --blue-line: #c8d6e5;
        }

        body {
            background-color: #c4a484;
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(0deg, rgba(0,0,0,0.03) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 80%),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            background-size: 40px 40px, 40px 40px, auto, auto;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Caveat', cursive;
            padding: 20px;
        }

        .auth-card {
            background:
                linear-gradient(to bottom, var(--blue-line) 1px, transparent 1px),
                var(--paper);
            background-size: 100% 28px;
            border: 3px solid var(--ink-light);
            border-radius: 12px 18px 4px 20px / 20px 4px 18px 12px;
            box-shadow:
                15px 15px 0px rgba(92,79,58,0.2),
                0 30px 60px rgba(0,0,0,0.3);
            perspective: 1000px;
            transform-style: preserve-3d;
            animation: cardEntrance 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: rotateY(-10deg) scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: rotateY(0deg) scale(1) translateY(0); }
        }

        input {
            font-family: 'Caveat', cursive;
        }
    </style>
</head>
<body>

    <div class="auth-card max-w-md w-full p-0 overflow-hidden relative">
        <a href="/login" class="absolute top-4 left-4 text-sketch-ink opacity-50 hover:opacity-100 transition-all flex items-center gap-1 no-underline font-bold">
            <i data-lucide="arrow-left" size="18"></i> Back to Login
        </a>

        <div class="p-8 pt-12">
            <div class="text-center mb-8">
                <h1 class="font-marker text-4xl mb-2">Type<span class="text-sketch-orange">Jaldi</span></h1>
                <p class="text-sketch-ink opacity-60 italic text-lg">~ reset your secret key ~</p>
            </div>

            <!-- Messages -->
            <div id="auth-error" class="text-red-500 text-center mb-4 min-h-[24px] font-bold"></div>
            <div id="auth-success" class="text-green-600 text-center mb-4 min-h-[24px] font-bold"></div>

            <!-- Reset Password Form -->
            <form id="form-reset" class="space-y-6">
                <div class="text-center mb-4">
                    <h3 class="font-marker text-2xl">New Secret Key</h3>
                    <p class="text-sm italic opacity-70">Make it strong and sketchy.</p>
                </div>
                <input type="hidden" id="reset-token-val">
                <div>
                    <label class="block text-sm font-bold text-sketch-ink opacity-70 uppercase tracking-widest mb-1 ml-1">New Password</label>
                    <input type="password" id="reset-pass" required minlength="8" class="w-full px-4 py-3 border-2 border-sketch-ink/20 rounded-xl focus:border-sketch-orange outline-none bg-white/50 text-xl transition-all shadow-inner">
                </div>
                <div>
                    <label class="block text-sm font-bold text-sketch-ink opacity-70 uppercase tracking-widest mb-1 ml-1">Confirm Password</label>
                    <input type="password" id="reset-pass-confirm" required minlength="8" class="w-full px-4 py-3 border-2 border-sketch-ink/20 rounded-xl focus:border-sketch-orange outline-none bg-white/50 text-xl transition-all shadow-inner">
                </div>
                <button type="submit" id="btn-reset" class="w-full py-4 bg-sketch-orange text-white font-marker text-2xl rounded-2xl border-b-4 border-orange-800 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-3 shadow-lg">
                    <i data-lucide="check-circle"></i> Update Password
                </button>
            </form>

            <div id="invalid-token" class="hidden text-center py-8">
                <i data-lucide="alert-triangle" class="mx-auto w-16 h-16 text-red-400 mb-4"></i>
                <h3 class="font-marker text-2xl mb-2">Invalid or Expired Link</h3>
                <p class="opacity-70 italic mb-6">This link has lost its ink. Please request a new one.</p>
                <a href="/login" class="inline-block py-3 px-8 bg-sketch-ink text-white font-marker rounded-xl">Go to Login</a>
            </div>
        </div>

        <p class="p-6 bg-black/5 text-center text-xs text-sketch-ink opacity-40 uppercase tracking-widest font-bold">
            Securely sketching your new credentials <i data-lucide="shield" class="inline-block w-3 h-3 ml-1"></i>
        </p>
    </div>

    <script>
        lucide.createIcons();

        const params = new URLSearchParams(window.location.search);
        const token = params.get('reset_token');

        if (!token) {
            document.getElementById('form-reset').classList.add('hidden');
            document.getElementById('invalid-token').classList.remove('hidden');
        } else {
            document.getElementById('reset-token-val').value = token;
        }

        // Reset Password Logic
        document.getElementById('form-reset').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('auth-error');
            const successDiv = document.getElementById('auth-success');
            errorDiv.textContent = '';
            
            const pass = document.getElementById('reset-pass').value;
            const confirm = document.getElementById('reset-pass-confirm').value;

            if (pass !== confirm) {
                errorDiv.textContent = 'Passwords do not match!';
                return;
            }

            const btn = document.getElementById('btn-reset');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Updating...';
            lucide.createIcons();

            try {
                const res = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: pass })
                });
                const data = await res.json();
                if (res.ok) {
                    successDiv.textContent = 'Password updated! Redirecting to login...';
                    document.getElementById('form-reset').classList.add('opacity-50', 'pointer-events-none');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2500);
                } else {
                    errorDiv.textContent = data.detail || 'Failed to update password';
                    if (data.detail && data.detail.includes('token')) {
                        document.getElementById('form-reset').classList.add('hidden');
                        document.getElementById('invalid-token').classList.remove('hidden');
                    }
                }
            } catch {
                errorDiv.textContent = 'Network error. Is the server running?';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="check-circle"></i> Update Password';
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
