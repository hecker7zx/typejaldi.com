<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TypeJaldi</title>
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/fa6-solid:keyboard.svg?color=%23ff5d00">
    <link rel="stylesheet" href="auth.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" id="authCard">
            <div class="text-center mb-8">
                <a href="/" class="logo block mb-2" style="transform: rotate(0deg); text-align: center;">Type<span>Jaldi</span></a>
                <p class="text-sm opacity-50 font-bold uppercase tracking-widest">Master the sketch</p>
            </div>

            <div class="auth-tabs" id="authTabs">
                <div class="auth-tab active" onclick="switchTab('login', this)">Login</div>
                <div class="auth-tab" onclick="switchTab('signup', this)">Sign Up</div>
            </div>

            <div id="auth-message" class="text-center mb-4 text-sm font-bold min-h-[20px]"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input type="text" id="login-user" class="form-input" placeholder="e.g. sketching_ninja" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-pass" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="flex justify-between items-center text-xs mb-6">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="accent-primary"> Remember me
                    </label>
                    <a href="/reset-password.html" class="text-primary font-bold hover:underline">Forgot?</a>
                </div>
                <button type="submit" id="btn-login" class="auth-btn">
                    <i data-lucide="key" class="w-5 h-5"></i> Enter Workspace
                </button>
            </form>

            <!-- Signup Form (Hidden) -->
            <form id="signupForm" class="auth-form hidden">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="signup-user" class="form-input" placeholder="ninja123" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="signup-email" class="form-input" placeholder="ninja@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="signup-pass" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-signup" class="auth-btn">
                    <i data-lucide="sparkles" class="w-5 h-5"></i> Create Account
                </button>
            </form>

            <div class="social-auth">
                <a href="/auth/google" class="btn-social no-underline text-ink">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18">
                    Continue with Google
                </a>
            </div>

            <div class="auth-footer">
                Back to <a href="/">Sketching</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const authMessage = document.getElementById('auth-message');

        // Entrance Animation
        gsap.from('#authCard', {
            y: 30,
            opacity: 0,
            duration: 1,
            ease: 'power4.out'
        });

        function switchTab(tab, el) {
            authMessage.textContent = "";
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');

            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');

            if (tab === 'login') {
                gsap.to(signupForm, { opacity: 0, x: 20, duration: 0.3, onComplete: () => {
                    signupForm.classList.add('hidden');
                    loginForm.classList.remove('hidden');
                    gsap.fromTo(loginForm, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3 });
                }});
            } else {
                gsap.to(loginForm, { opacity: 0, x: -20, duration: 0.3, onComplete: () => {
                    loginForm.classList.add('hidden');
                    signupForm.classList.remove('hidden');
                    gsap.fromTo(signupForm, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3 });
                }});
            }
        }

        // Login Logic
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            authMessage.textContent = "";
            authMessage.className = "text-center mb-4 text-sm font-bold min-h-[20px]";

            const btn = document.getElementById("btn-login");
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> Processing...';
            lucide.createIcons();

            const username = document.getElementById("login-user").value.trim();
            const password = document.getElementById("login-pass").value;

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username_or_email: username, password }),
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("access_token", data.access_token);
                    localStorage.setItem("username", data.username || username);
                    window.location.href = "/";
                } else {
                    authMessage.textContent = data.detail || "Login failed";
                    authMessage.classList.add("text-red-500");
                }
            } catch {
                authMessage.textContent = "Network error. Is the server running?";
                authMessage.classList.add("text-red-500");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
                lucide.createIcons();
            }
        });

        // Signup Logic
        document.getElementById("signupForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            authMessage.textContent = "";
            authMessage.className = "text-center mb-4 text-sm font-bold min-h-[20px]";

            const btn = document.getElementById("btn-signup");
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> Creating...';
            lucide.createIcons();

            const username = document.getElementById("signup-user").value.trim();
            const email = document.getElementById("signup-email").value.trim();
            const password = document.getElementById("signup-pass").value;

            try {
                const res = await fetch("/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password }),
                });
                const data = await res.json();
                if (res.ok) {
                    authMessage.textContent = "Account created! You can now login.";
                    authMessage.classList.add("text-green-600");
                    setTimeout(() => switchTab('login', document.querySelector('.auth-tab')), 2000);
                } else {
                    authMessage.textContent = data.detail || "Signup failed";
                    authMessage.classList.add("text-red-500");
                }
            } catch {
                authMessage.textContent = "Network error. Is the server running?";
                authMessage.classList.add("text-red-500");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
