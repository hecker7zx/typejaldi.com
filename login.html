<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeJaldi - Login / Sign Up</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Permanent+Marker&family=Rock+Salt&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sketch: {
                orange: "#e8874b",
                purple: "#7b5ea7",
                teal: "#4a9c8c",
                ink: "#2c2416",
                paper: "#fdfaf3",
              },
            },
            fontFamily: {
              sketch: ["Caveat", "cursive"],
              marker: ['"Permanent Marker"', "cursive"],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --paper: #fdfaf3;
        --ink: #2c2416;
        --ink-light: #5c4f3a;
        --sketch-orange: #e8874b;
        --blue-line: #c8d6e5;
      }

      body {
        background-color: #c4a484;
        background-image:
          linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
          linear-gradient(0deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
          radial-gradient(
            circle at 50% 50%,
            rgba(255, 255, 255, 0.1) 0%,
            transparent 80%
          ),
          url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        background-size:
          40px 40px,
          40px 40px,
          auto,
          auto;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Caveat", cursive;
        padding: 20px;
      }

      .auth-card {
        background:
          linear-gradient(to bottom, var(--blue-line) 1px, transparent 1px),
          var(--paper);
        background-size: 100% 28px;
        border: 3px solid var(--ink-light);
        border-radius: 12px 18px 4px 20px / 20px 4px 18px 12px;
        box-shadow:
          15px 15px 0px rgba(92, 79, 58, 0.2),
          0 30px 60px rgba(0, 0, 0, 0.3);
        perspective: 1000px;
        transform-style: preserve-3d;
        animation: cardEntrance 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)
          forwards;
      }

      @keyframes cardEntrance {
        0% {
          opacity: 0;
          transform: rotateY(-10deg) scale(0.95) translateY(20px);
        }
        100% {
          opacity: 1;
          transform: rotateY(0deg) scale(1) translateY(0);
        }
      }

      .auth-tab.active {
        background: var(--sketch-orange);
        color: #fff;
      }

      svg.lucide {
        filter: drop-shadow(1px 1px 0px rgba(0, 0, 0, 0.1));
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      input {
        font-family: "Caveat", cursive;
      }
    </style>
  </head>
  <body>
    <div class="auth-card max-w-md w-full p-0 overflow-hidden relative">
      <a
        href="/"
        class="absolute top-4 left-4 text-sketch-ink opacity-50 hover:opacity-100 transition-all flex items-center gap-1 no-underline font-bold"
      >
        <i data-lucide="arrow-left" size="18"></i> Back
      </a>

      <div class="p-8 pt-12">
        <div class="text-center mb-8">
          <h1 class="font-marker text-4xl mb-2">
            Type<span class="text-sketch-orange">Jaldi</span>
          </h1>
          <p class="text-sketch-ink opacity-60 italic text-lg">
            ~ sharpen your sketch-typing skills ~
          </p>
        </div>

        <!-- Tabs -->
        <div
          class="flex border-2 border-sketch-ink rounded-xl overflow-hidden mb-8 shadow-sm"
        >
          <button
            class="flex-1 py-3 font-bold text-xl transition-all auth-tab active"
            id="tab-login"
            onclick="switchTab('login')"
          >
            <i
              data-lucide="log-in"
              class="inline-block w-5 h-5 mr-1 align-text-bottom"
            ></i>
            Login
          </button>
          <button
            class="flex-1 py-3 font-bold text-xl transition-all border-l-2 border-sketch-ink auth-tab"
            id="tab-signup"
            onclick="switchTab('signup')"
          >
            <i
              data-lucide="user-plus"
              class="inline-block w-5 h-5 mr-1 align-text-bottom"
            ></i>
            Sign Up
          </button>
        </div>

        <!-- Messages -->
        <div
          id="auth-error"
          class="text-red-500 text-center mb-4 min-h-[24px] font-bold"
        ></div>
        <div
          id="auth-success"
          class="text-green-600 text-center mb-4 min-h-[24px] font-bold"
        ></div>

        <!-- Login Form -->
        <form id="form-login" class="space-y-6">
          <div>
            <label
              class="block text-sm font-bold text-sketch-ink opacity-70 uppercase tracking-widest mb-1 ml-1"
              >Username or Email</label
            >
            <input
              type="text"
              id="login-user"
              required
              class="w-full px-4 py-3 border-2 border-sketch-ink/20 rounded-xl focus:border-sketch-orange outline-none bg-white/50 text-xl transition-all shadow-inner"
            />
          </div>
          <div>
            <label
              class="block text-sm font-bold text-sketch-ink opacity-70 uppercase tracking-widest mb-1 ml-1"
              >Password</label
            >
            <input
              type="password"
              id="login-pass"
              required
              class="w-full px-4 py-3 border-2 border-sketch-ink/20 rounded-xl focus:border-sketch-orange outline-none bg-white/50 text-xl transition-all shadow-inner"
            />
          </div>
          <button
            type="submit"
            id="btn-login"
            class="w-full py-4 bg-sketch-orange text-white font-marker text-2xl rounded-2xl border-b-4 border-orange-800 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-3 shadow-lg"
          >
            <i data-lucide="key"></i> Enter Workspace
          </button>
        </form>

        <!-- Signup Form -->
        <form id="form-signup" class="space-y-4 hidden">
          <div>
            <label
              class="block text-sm font-bold text-sketch-ink opacity-70 uppercase tracking-widest mb-1 ml-1"
              >Username</label
            >
            <input
              type="text"
              id="signup-user"
              required
              minlength="3"
              class="w-full px-4 py-2 border-2 border-sketch-ink/20 rounded-xl focus:border-sketch-orange outline-none bg-white/50 text-xl transition-all"
            />
          </div>
          <div>
            <label
              class="block text-sm font-bold text-sketch-ink opacity-70 uppercase tracking-widest mb-1 ml-1"
              >Email</label
            >
            <input
              type="email"
              id="signup-email"
              required
              class="w-full px-4 py-2 border-2 border-sketch-ink/20 rounded-xl focus:border-sketch-orange outline-none bg-white/50 text-xl transition-all"
            />
          </div>
          <div>
            <label
              class="block text-sm font-bold text-sketch-ink opacity-70 uppercase tracking-widest mb-1 ml-1"
              >Full Name</label
            >
            <input
              type="text"
              id="signup-name"
              class="w-full px-4 py-2 border-2 border-sketch-ink/20 rounded-xl focus:border-sketch-orange outline-none bg-white/50 text-xl transition-all"
            />
          </div>
          <div>
            <label
              class="block text-sm font-bold text-sketch-ink opacity-70 uppercase tracking-widest mb-1 ml-1"
              >Password</label
            >
            <input
              type="password"
              id="signup-pass"
              required
              minlength="8"
              class="w-full px-4 py-2 border-2 border-sketch-ink/20 rounded-xl focus:border-sketch-orange outline-none bg-white/50 text-xl transition-all"
            />
          </div>
          <button
            type="submit"
            id="btn-signup"
            class="w-full py-4 bg-sketch-orange text-white font-marker text-2xl rounded-2xl border-b-4 border-orange-800 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-3 shadow-lg mt-4"
          >
            <i data-lucide="sparkles"></i> Create Account
          </button>
        </form>

        <div class="flex items-center gap-4 my-8">
          <div class="flex-1 h-px bg-sketch-ink opacity-20"></div>
          <span class="text-sm font-bold opacity-40 uppercase tracking-widest"
            >or</span
          >
          <div class="flex-1 h-px bg-sketch-ink opacity-20"></div>
        </div>

        <a
          href="/auth/google"
          class="w-full py-3 flex items-center justify-center gap-3 border-2 border-sketch-ink/20 rounded-2xl hover:bg-white/80 transition-all font-bold text-sketch-ink no-underline shadow-sm hover:shadow-md"
        >
          <svg width="24" height="24" viewBox="0 0 48 48">
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
          Sign in with Google
        </a>
      </div>

      <p
        class="p-6 bg-black/5 text-center text-xs text-sketch-ink opacity-40 uppercase tracking-widest font-bold"
      >
        Your progress stays private & sketchy
        <i data-lucide="pencil" class="inline-block w-3 h-3 ml-1"></i>
      </p>
    </div>

    <script>
      lucide.createIcons();

      function switchTab(tab) {
        document.getElementById("auth-error").textContent = "";
        document.getElementById("auth-success").textContent = "";

        if (tab === "login") {
          document.getElementById("form-login").classList.remove("hidden");
          document.getElementById("form-signup").classList.add("hidden");
          document.getElementById("tab-login").classList.add("active");
          document.getElementById("tab-signup").classList.remove("active");
        } else {
          document.getElementById("form-login").classList.add("hidden");
          document.getElementById("form-signup").classList.remove("hidden");
          document.getElementById("tab-signup").classList.add("active");
          document.getElementById("tab-login").classList.remove("active");
        }
        lucide.createIcons();
      }

      // Login Logic
      document
        .getElementById("form-login")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errorDiv = document.getElementById("auth-error");
          errorDiv.textContent = "";

          const btn = document.getElementById("btn-login");
          btn.disabled = true;
          btn.innerHTML =
            '<i data-lucide="loader-2" class="animate-spin"></i> Processing...';
          lucide.createIcons();

          const username = document.getElementById("login-user").value.trim();
          const password = document.getElementById("login-pass").value;

          try {
            const res = await fetch("/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username_or_email: username, password }),
            });
            const data = await res.json();
            if (res.ok) {
              localStorage.setItem("access_token", data.access_token);
              localStorage.setItem("username", data.username || username);
              window.location.href = "/";
            } else {
              errorDiv.textContent =
                typeof data.detail === "string"
                  ? data.detail
                  : Array.isArray(data.detail)
                    ? data.detail[0].msg
                    : "Login failed";
            }
          } catch {
            errorDiv.textContent = "Network error. Is the server running?";
          } finally {
            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="key"></i> Enter Workspace';
            lucide.createIcons();
          }
        });

      // Signup Logic
      document
        .getElementById("form-signup")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errorDiv = document.getElementById("auth-error");
          const successDiv = document.getElementById("auth-success");
          errorDiv.textContent = "";
          successDiv.textContent = "";

          const btn = document.getElementById("btn-signup");
          btn.disabled = true;
          btn.innerHTML =
            '<i data-lucide="loader-2" class="animate-spin"></i> Creating...';
          lucide.createIcons();

          const username = document.getElementById("signup-user").value.trim();
          const email = document.getElementById("signup-email").value.trim();
          const full_name = document.getElementById("signup-name").value.trim();
          const password = document.getElementById("signup-pass").value;

          try {
            const res = await fetch("/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username,
                email,
                password,
                full_name: full_name || undefined,
              }),
            });
            const data = await res.json();
            if (res.ok) {
              successDiv.textContent = "Account created! Please login.";
              document.getElementById("form-signup").reset();
              setTimeout(() => switchTab("login"), 1500);
            } else {
              errorDiv.textContent =
                typeof data.detail === "string"
                  ? data.detail
                  : Array.isArray(data.detail)
                    ? data.detail[0].msg
                    : "Signup failed";
            }
          } catch {
            errorDiv.textContent = "Network error. Is the server running?";
          } finally {
            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="sparkles"></i> Create Account';
            lucide.createIcons();
          }
        });
    </script>
  </body>
</html>
